{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
    <h1>Connexion</h1>
    {% if error %}
        <div class="message erreur">Identifiant ou mot de passe incorrect.</div>
    {% endif %}
    <div class="carte">
        <form action="{{ url_for('authentification') }}" method="post">
            <p><label for="username">Nom d'utilisateur :</label><br>
               <input type="text" id="username" name="username" required></p>
            <p><label for="password">Mot de passe :</label><br>
               <input type="password" id="password" name="password" required></p>
            <button type="submit">Se connecter</button>
        </form>
    </div>
{% endblock %}
