{% extends "base.html" %}
{% block titre %}Nouveau compte{% endblock %}
{% block contenu %}
    <h1>Créer un compte</h1>
    {% if erreur %}<div class="message erreur">{{ erreur }}</div>{% endif %}
    <div class="carte">
        <form method="post">
            <p><label>Login * :<br><input type="text" name="login" value="{{ u['login'] or '' }}" required></label></p>
            <p><label>Nom :<br><input type="text" name="nom" value="{{ u['nom'] or '' }}"></label></p>
            <p><label>Prénom :<br><input type="text" name="prenom" value="{{ u['prenom'] or '' }}"></label></p>
            <p><label>Mot de passe * :<br><input type="password" name="mot_de_passe" required></label></p>
            <p><label>Rôle :<br>
                <select name="role">
                    <option value="user" {% if u['role'] == 'user' %}selected{% endif %}>user</option>
                    <option value="admin" {% if u['role'] == 'admin' %}selected{% endif %}>admin</option>
                </select></label></p>
            <button type="submit">Créer</button>
            <a href="/admin/utilisateurs">Annuler</a>
        </form>
    </div>
{% endblock %}
